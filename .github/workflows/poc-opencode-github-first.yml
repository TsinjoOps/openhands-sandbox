name: OpenCode GitHub-first POC

on:
  pull_request:
    branches: [main]
    paths:
      - 'poc_opencode_github_first/**'
      - '.github/workflows/poc-opencode-github-first.yml'

permissions:
  contents: read

jobs:
  controlled-fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'
      - name: Run controlled fixture test
        run: python3 -B -m unittest poc_opencode_github_first.test_arithmetic -v
